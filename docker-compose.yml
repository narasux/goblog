# 配置参考：
# - https://docs.docker.com/compose/compose-file/
# - https://www.cnblogs.com/davis12/p/14312267.html
services:
  # 数据存储服务（MySQL）
  unity-mysql:
    image: mysql:8.0.36
    container_name: unity-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - goblog
    # 3306 仅容器网络内访问（goblog 通过 service 名连接），不对宿主机/公网暴露；
    # 如需本机调试，临时改为 - "127.0.0.1:3306:3306"，用完移除。
    volumes:
      - ${ROOT_DIR}/mysql-data:/var/lib/mysql
  # 博客 web 服务
  goblog-migrate:
    image: goblog:${GOBLOG_IMAGE_TAG}
    container_name: goblog-migrate
    entrypoint:
      - goblog
      - migrate
    # 等待 mysql 就绪再执行 migrate
    depends_on:
      - unity-mysql
    environment:
      LOG_LEVEL: info
      MYSQL_HOST: unity-mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - goblog
    volumes:
      - ${ROOT_DIR}/goblog-logs:/data/logs/
  # 博客 web 服务
  goblog-web:
    image: goblog:${GOBLOG_IMAGE_TAG}
    container_name: goblog-web
    # 等待 mysql 就绪，且 migrate 执行完成后，再启动 web 服务
    depends_on:
      - unity-mysql
      - goblog-migrate
    environment:
      LOG_LEVEL: info
      REAL_CLIENT_IP_HEADER_KEY: X-Real-IP
      GOOGLE_SITE_VERIFICATION_CODE: ${GOOGLE_SITE_VERIFICATION_CODE}
      BAIDU_SITE_VERIFICATION_CODE: ${BAIDU_SITE_VERIFICATION_CODE}
      MYSQL_HOST: unity-mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE}
      INTERACTION_ENABLED: ${INTERACTION_ENABLED}
    networks:
      - goblog
    # 由 unity-nginx 在容器网络内反代，不对宿主机/公网暴露 8080；
    # 如需本机调试，临时改为 - "127.0.0.1:8080:8080"，用完移除。
    volumes:
      - ${ROOT_DIR}/goblog-logs:/data/logs/
  # 反向代理 Nginx
  unity-nginx:
    image: nginx:1.25.5
    container_name: unity-nginx
    # 先启动 web 服务再代理
    depends_on:
      - goblog-web
    networks:
      - goblog
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${ROOT_DIR}/ssl_cert:/etc/nginx/ssl
      - ${ROOT_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf
# 所有容器共享同一网络
networks:
  goblog:
    driver: bridge
