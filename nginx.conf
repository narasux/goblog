server {
    listen       80;
    listen  [::]:80;
    server_name  www.narasux.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.narasux.cn;

    ssl_certificate /etc/nginx/ssl/www.narasux.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/www.narasux.cn.key;

    location / {
        # 使用变量 + Docker 内置 DNS：goblog-web 重建换 IP 后也能重新解析，
        # 否则 Nginx 只在启动时解析一次并永久缓存旧 IP，会导致 502
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $goblog_upstream "goblog-web:8080";
        proxy_pass http://$goblog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
