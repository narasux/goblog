{{- define "common.header" }}
<header class="w-full bg-sky-400 shadow">
  <div class="container mx-auto flex flex-row flex-wrap items-center p-5">
    <a href="/" class="mb-0 flex items-center text-white">
      <span class="text-2xl font-bold">Narasux</span>
    </a>
    <nav class="ml-auto flex items-center justify-center text-white">
      <ul class="flex items-center space-x-4">
        <li class="hover:underline">
          <a href="/">Home</a>
        </li>
        <li class="hover:underline">
          <a href="/articles">Articles</a>
        </li>
        <li class="hover:underline">
          <a href="/periodic-table">PeriodicTable</a>
        </li>
        {{- if .user }}
        <!-- 已登录状态 -->
        <li class="flex items-center">
          <img src="{{ .user.AvatarURL }}" alt="avatar" class="h-8 w-8 rounded-full border-2 border-white" />
        </li>
        <li>
          <a href="/auth/logout" title="Logout">
            {{ template "common.icon.logout" }}
          </a>
        </li>
        {{- else }}
        <!-- 未登录状态 -->
        <li>
          <a id="login-btn" href="/auth/github/login" title="GitHub Login">
            {{ template "common.icon.login" }}
          </a>
          <script>
            (function() {
              var loginBtn = document.getElementById('login-btn');
              if (loginBtn) {
                var currentPath = window.location.pathname;
                loginBtn.href = '/auth/github/login?redirect=' + encodeURIComponent(currentPath);
              }
            })();
          </script>
        </li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
{{- end }}
